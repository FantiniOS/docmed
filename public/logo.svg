<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="person1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="person2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Group: Icon (Left side) -->
  <g transform="translate(40, 40)">
    <!-- People behind folder -->
    <!-- Person 1 (Left/Teal) -->
    <circle cx="80" cy="50" r="25" fill="url(#person1)" />
    <path d="M40 130 C40 90, 120 90, 120 130" fill="url(#person1)" />
    
    <!-- Person 2 (Right/Blue) -->
    <circle cx="160" cy="70" r="20" fill="url(#person2)" />
    <path d="M130 140 C130 110, 190 110, 190 140" fill="url(#person2)" />

    <!-- Person 3 (Center/Child) -->
    <circle cx="120" cy="90" r="15" fill="#38bdf8" />
    <path d="M100 140 C100 120, 140 120, 140 140" fill="#38bdf8" />

    <!-- Folder Front -->
    <path d="M10 130 Q10 110 30 110 L100 110 L120 130 L230 130 Q250 130 250 150 L240 220 Q235 240 215 240 L35 240 Q15 240 10 220 Z" fill="url(#folderGrad)" />
    
    <!-- White Cross on Folder -->
    <path d="M110 160 L140 160 L140 190 L110 190 Z" fill="white" />
    <path d="M95 175 L155 175" stroke="white" stroke-width="12" />
    <path d="M125 145 L125 205" stroke="white" stroke-width="12" />

    <!-- Swoosh around folder -->
    <path d="M -10 180 Q 125 300 270 180" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Group: Text (Right side) -->
  <g transform="translate(320, 180)">
    <!-- DocMed Text -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="900" font-size="110" letter-spacing="-2">
      <tspan fill="#1e3a8a">Doc</tspan>
      <tspan fill="#0d9488">Med</tspan>
    </text>
    
    <!-- Slogan -->
    <text x="5" y="45" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#4b5563" letter-spacing="0.5">
      Saúde para hoje. Tranquilidade para sempre.
    </text>
  </g>
</svg>
